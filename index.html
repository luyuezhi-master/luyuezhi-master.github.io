<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05070d">
<title>时间的尽头 · THE END OF TIME</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap');
:root{--ink:#e9e5d9;--muted:rgba(220,222,225,.56);--gold:#d9b879;--line:rgba(220,211,190,.22)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:var(--ink)}
body{font-family:"Noto Serif SC",serif;letter-spacing:.08em}
#stage{position:fixed;inset:0;z-index:0}canvas{display:block}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 48%,transparent 20%,rgba(2,4,9,.28) 65%,#03050a 110%),linear-gradient(180deg,rgba(2,4,8,.5),transparent 25%,transparent 70%,rgba(2,4,8,.7))}
.grain{position:fixed;inset:-50%;z-index:2;pointer-events:none;opacity:.055;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");animation:grain .22s steps(2) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(2%,-1%)}50%{transform:translate(-1%,2%)}75%{transform:translate(1%,1%)}100%{transform:translate(-2%,-1%)}}
.ui{position:fixed;inset:0;z-index:3;pointer-events:none;padding:clamp(22px,4vw,58px);display:flex;flex-direction:column;justify-content:space-between}
.top,.bottom{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.brand{font:400 11px/1.7 "Cormorant Garamond",serif;letter-spacing:.28em;color:rgba(231,224,208,.72)}
.coordinates{text-align:right;font:10px/1.9 "Cormorant Garamond",serif;letter-spacing:.18em;color:var(--muted)}
.center{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);text-align:center;width:min(90vw,900px);pointer-events:none}
.eyebrow{font:11px "Cormorant Garamond",serif;letter-spacing:.55em;color:var(--gold);opacity:.9;margin-bottom:24px}
h1{font-weight:300;font-size:clamp(38px,7.4vw,92px);letter-spacing:.25em;margin:0 0 15px 0;text-indent:.25em;text-shadow:0 0 38px rgba(212,179,123,.18)}
.en{font:300 clamp(13px,1.7vw,19px) "Cormorant Garamond",serif;letter-spacing:.48em;color:rgba(229,223,211,.72);text-indent:.48em}
.rule{width:1px;height:62px;margin:30px auto 20px;background:linear-gradient(transparent,var(--gold),transparent);opacity:.7}
.quote{font-size:12px;letter-spacing:.2em;line-height:2.2;color:rgba(224,222,216,.66)}
.bottom{align-items:flex-end}
.hint{font-size:10px;line-height:2.1;color:var(--muted);letter-spacing:.15em}
.controls{display:flex;gap:10px;pointer-events:auto;align-items:center}
button{border:1px solid var(--line);background:rgba(7,10,17,.32);color:rgba(235,229,216,.76);padding:10px 14px;font:10px "Cormorant Garamond",serif;letter-spacing:.18em;cursor:pointer;backdrop-filter:blur(8px);transition:.3s}
.enter-garden{display:inline-flex;align-items:center;text-decoration:none;border:1px solid rgba(217,184,121,.58);background:rgba(217,184,121,.09);color:#f2d9a9;padding:10px 15px;font:10px "Cormorant Garamond",serif;letter-spacing:.18em;backdrop-filter:blur(8px);transition:.3s}.enter-garden:hover{background:rgba(217,184,121,.18);border-color:#e4c18b}button:hover,button.active{border-color:rgba(217,184,121,.7);color:#f2d9a9;background:rgba(217,184,121,.08)}
.progress{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:min(220px,35vw);height:1px;background:rgba(255,255,255,.16);z-index:4}
.progress span{display:block;height:1px;width:0;background:var(--gold);box-shadow:0 0 8px var(--gold);transition:width .4s}
.panel{position:fixed;z-index:5;right:clamp(20px,5vw,70px);top:50%;transform:translate(20px,-50%);width:min(310px,78vw);padding:24px 25px;background:rgba(5,8,14,.76);border:1px solid rgba(217,184,121,.25);backdrop-filter:blur(18px);opacity:0;visibility:hidden;transition:.5s;pointer-events:auto}
.panel.open{opacity:1;visibility:visible;transform:translate(0,-50%)}
.panel small{color:var(--gold);font:10px "Cormorant Garamond",serif;letter-spacing:.3em}
.panel h2{font-weight:300;font-size:23px;letter-spacing:.16em;margin:15px 0}
.panel p{font-size:12px;line-height:2.2;color:rgba(229,226,216,.72);letter-spacing:.08em}
.panel button{margin-top:12px}
.crosshair{position:fixed;z-index:3;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);opacity:.35;pointer-events:none}
.crosshair:before,.crosshair:after{content:"";position:absolute;background:rgba(231,205,158,.8)}
.crosshair:before{width:1px;height:22px;left:10px}.crosshair:after{height:1px;width:22px;top:10px}
#loading{position:fixed;inset:0;z-index:10;background:#05070d;display:grid;place-items:center;transition:opacity 1s,visibility 1s}
#loading.done{opacity:0;visibility:hidden}
.loadtext{font:11px "Cormorant Garamond",serif;letter-spacing:.4em;color:var(--gold)}
.loadline{height:1px;width:150px;background:rgba(255,255,255,.15);margin:18px auto;overflow:hidden}
.loadline i{display:block;width:35%;height:100%;background:var(--gold);animation:load 1.3s ease-in-out infinite}
@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(400%)}}
@media(max-width:640px){.coordinates{display:none}.center{top:47%}.quote{font-size:10px}.bottom{align-items:flex-end}.hint{max-width:55%}.controls{gap:5px;flex-wrap:wrap;justify-content:flex-end}.enter-garden{padding:9px 10px;font-size:9px}button{padding:9px 10px}.panel{left:50%;right:auto;top:auto;bottom:80px;transform:translate(-50%,15px);width:calc(100% - 40px)}.panel.open{transform:translate(-50%,0)}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="stage"></div><div class="vignette"></div><div class="grain"></div>
<div id="loading"><div><div class="loadtext">ENTERING THE LAST MOMENT</div><div class="loadline"><i></i></div></div></div>
<div class="ui">
 <div class="top"><div class="brand">CHRONOS / 001<br>AN EXPERIENCE BEYOND TIME</div><div class="coordinates">深空观测站 · 终末纪元<br>UNIVERSE : 07 / ∞</div></div>
 <div class="center">
  <div class="eyebrow">当一切都走向沉寂</div>
  <h1>时间的尽头</h1>
  <div class="en">THE END OF TIME</div>
  <div class="rule"></div>
  <div class="quote">如果时间停止流动，<br>你会用最后一秒，记住什么？</div>
 </div>
 <div class="bottom"><div class="hint">拖动以环视 · 滚轮以穿越<br>点击光点，拾取时间的残片</div><div class="controls"><a class="enter-garden" href="./garden/">ENTER THE GARDEN ↗</a><button id="sound">SOUND : OFF</button><button id="reset">重新开始 ↺</button></div></div>
</div>
<div class="crosshair"></div><div class="progress"><span id="progress"></span></div>
<div class="panel" id="panel"><small id="fragmentNo">FRAGMENT 001</small><h2 id="fragmentTitle">最后的黎明</h2><p id="fragmentText"></p><button id="closePanel">收起 ×</button></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const mount=document.querySelector('#stage');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x05070d); scene.fog=new THREE.FogExp2(0x05070d,.018);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,240); camera.position.set(0,1.4,17);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15; renderer.outputColorSpace=THREE.SRGBColorSpace; mount.appendChild(renderer.domElement);
const composer=new EffectComposer(renderer); composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.15,.65,.12); composer.addPass(bloom);
scene.add(new THREE.AmbientLight(0x52617d,.55));
const key=new THREE.PointLight(0xe8c994,150,65); key.position.set(0,3,1); scene.add(key);
const blue=new THREE.PointLight(0x466da9,90,55); blue.position.set(-9,-3,-9); scene.add(blue);

// A distant, fractured hourglass: two luminous glass chambers and a collapsing singularity.
const core=new THREE.Group(); scene.add(core);
const goldMat=new THREE.MeshPhysicalMaterial({color:0xb78e55,metalness:.82,roughness:.22,emissive:0x4b2d10,emissiveIntensity:.65});
const glassMat=new THREE.MeshPhysicalMaterial({color:0x9db4c9,metalness:.16,roughness:.08,transmission:.72,thickness:1.2,transparent:true,opacity:.25,side:THREE.DoubleSide,ior:1.35});
const darkMat=new THREE.MeshStandardMaterial({color:0x111927,metalness:.8,roughness:.28});
function makeHourglass(){
 const profile=[[-2.8,2.25],[-2.5,2.05],[-1.9,1.55],[-1.25,.9],[-.6,.34],[0,.14],[.6,.34],[1.25,.9],[1.9,1.55],[2.5,2.05],[2.8,2.25]];
 const pts=profile.map(([y,r])=>new THREE.Vector2(r,y));
 const geo=new THREE.LatheGeometry(pts,96); const glass=new THREE.Mesh(geo,glassMat); core.add(glass);
 for(const y of [-2.82,2.82]){const ring=new THREE.Mesh(new THREE.TorusGeometry(2.22,.055,12,100),goldMat);ring.rotation.x=Math.PI/2;ring.position.y=y;core.add(ring)}
 const neck=new THREE.Mesh(new THREE.TorusGeometry(.2,.045,10,64),goldMat);neck.rotation.x=Math.PI/2;core.add(neck);
 for(let i=0;i<2;i++){const ring=new THREE.Mesh(new THREE.TorusGeometry(2.18-i*.12,.018,8,100),new THREE.MeshBasicMaterial({color:0x9d7847,transparent:true,opacity:.65}));ring.rotation.x=Math.PI/2;ring.position.y=(i?2.68:-2.68);core.add(ring)}
 // Floating metallic splinters around the glass.
 for(let i=0;i<36;i++){const a=i*2.399, y=(Math.random()-.5)*5.6, r=2.35+Math.random()*1.4;const shard=new THREE.Mesh(new THREE.OctahedronGeometry(.035+Math.random()*.1,0),goldMat);shard.position.set(Math.cos(a)*r,y,Math.sin(a)*r);shard.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);core.add(shard)}
}
makeHourglass(); core.position.set(0,-.1,-1.7); core.rotation.z=-.08;

// A black sun at the center.
const singularity=new THREE.Mesh(new THREE.SphereGeometry(.34,48,48),new THREE.MeshBasicMaterial({color:0x020308})); singularity.position.set(0,0,-1.7); scene.add(singularity);
const halo=new THREE.Mesh(new THREE.TorusGeometry(.53,.018,12,128),new THREE.MeshBasicMaterial({color:0xe0b878,transparent:true,opacity:.8}));halo.position.copy(singularity.position);halo.rotation.x=.4;scene.add(halo);
const halo2=new THREE.Mesh(new THREE.TorusGeometry(.76,.008,8,128),new THREE.MeshBasicMaterial({color:0x7297c2,transparent:true,opacity:.45}));halo2.position.copy(singularity.position);halo2.rotation.set(1.2,.3,.2);scene.add(halo2);

// Star field and nebula-like dust.
const starCount=5200, starPos=new Float32Array(starCount*3), starCol=new Float32Array(starCount*3), starSizes=new Float32Array(starCount);
for(let i=0;i<starCount;i++){const r=18+Math.random()*100, a=Math.random()*Math.PI*2, u=Math.random()*2-1;starPos[i*3]=r*Math.sqrt(1-u*u)*Math.cos(a);starPos[i*3+1]=r*u;starPos[i*3+2]=r*Math.sqrt(1-u*u)*Math.sin(a)-22;const c=new THREE.Color().setHSL(.55+Math.random()*.13,.22,.48+Math.random()*.45);starCol.set([c.r,c.g,c.b],i*3);starSizes[i]=Math.random()*.9+.2}
const starGeo=new THREE.BufferGeometry();starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));starGeo.setAttribute('color',new THREE.BufferAttribute(starCol,3));
const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({size:.105,vertexColors:true,transparent:true,opacity:.9,sizeAttenuation:true}));scene.add(stars);
const dustCount=3200,dustPos=new Float32Array(dustCount*3);
for(let i=0;i<dustCount;i++){const a=Math.random()*Math.PI*2,r=3+Math.random()*18;dustPos[i*3]=Math.cos(a)*r;dustPos[i*3+1]=(Math.random()-.5)*12;dustPos[i*3+2]=Math.sin(a)*r-3}
const dustGeo=new THREE.BufferGeometry();dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));
const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xb7a17b,size:.025,transparent:true,opacity:.42,blending:THREE.AdditiveBlending}));scene.add(dust);

// The stream of sand, spiralling into the final second.
const sandCount=6500,sandPositions=new Float32Array(sandCount*3),sandColors=new Float32Array(sandCount*3),sandData=[];
for(let i=0;i<sandCount;i++){const t=Math.random(),a=Math.random()*Math.PI*2,r=.1+Math.random()*1.6; sandPositions[i*3]=Math.cos(a)*r;sandPositions[i*3+1]=(Math.random()-.5)*5.1;sandPositions[i*3+2]=Math.sin(a)*r;const c=new THREE.Color().setHSL(.095+Math.random()*.07,.55,.5+Math.random()*.28);sandColors.set([c.r,c.g,c.b],i*3);sandData.push({a,r,y:sandPositions[i*3+1],speed:.12+Math.random()*.55,phase:Math.random()*6.28})}
const sandGeo=new THREE.BufferGeometry();sandGeo.setAttribute('position',new THREE.BufferAttribute(sandPositions,3));sandGeo.setAttribute('color',new THREE.BufferAttribute(sandColors,3));
const sand=new THREE.Points(sandGeo,new THREE.PointsMaterial({size:.035,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));sand.position.set(0,0,-1.7);scene.add(sand);

// Memory shards, positioned in an orbit and selectable by raycasting.
const memories=[
 {title:'最后的黎明',text:'太阳熄灭之前，人类把最后一束光存进了玻璃。没有人知道它是否还能照亮未来。'},
 {title:'失重的海',text:'海洋蒸发后，鲸的歌声仍在深空传播。那是地球留给宇宙的、最后一段心跳。'},
 {title:'未寄出的信',text:'“如果你读到这里，说明时间已经越过了我。请不要为我悲伤，我曾真实地存在过。”'},
 {title:'宇宙的回声',text:'星系彼此远离，连光也无法抵达。可曾经发生过的事，并不会因此变得虚无。'},
 {title:'时间之外',text:'当最后一个粒子停止振动，时间失去了刻度。也许那不是终结，而是另一种开始。'}
];
const memoryGroup=new THREE.Group();scene.add(memoryGroup);const memoryMeshes=[];
memories.forEach((m,i)=>{const a=i/5*Math.PI*2+.35,r=5.5;const g=new THREE.Group();g.position.set(Math.cos(a)*r,Math.sin(a*1.7)*2.1-0.2,Math.sin(a)*r-2);const orb=new THREE.Mesh(new THREE.IcosahedronGeometry(.18,1),new THREE.MeshBasicMaterial({color:i%2?0x8caed3:0xe4c18b}));g.add(orb);const haloM=new THREE.Mesh(new THREE.TorusGeometry(.31,.008,8,48),new THREE.MeshBasicMaterial({color:i%2?0x7598c2:0xd6b273,transparent:true,opacity:.7}));haloM.rotation.x=Math.PI/2;g.add(haloM);const glow=new THREE.PointLight(i%2?0x628bc0:0xd7ae6e,2.2,4);g.add(glow);g.userData={index:i};memoryGroup.add(g);memoryMeshes.push(g)});

// A broken orbit made from fine arcs.
for(let j=0;j<4;j++){const curve=new THREE.EllipseCurve(0,0,4.2+j*.52,2.4+j*.34,.2+j*.3,Math.PI*1.8+j*.2,false,0);const pts=curve.getPoints(240).map(p=>new THREE.Vector3(p.x,p.y,(Math.random()-.5)*.1-2));const geo=new THREE.BufferGeometry().setFromPoints(pts);const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:j%2?0x526d8d:0x96794d,transparent:true,opacity:.22-j*.025}));line.rotation.x=.5+j*.22;line.rotation.y=j*.5;scene.add(line)}

// Interaction.
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let down=false,lastX=0,lastY=0,startX=0,startY=0,rotX=0,rotY=0,targetX=0,targetY=0,zoom=17,travel=0,activeMemory=-1;
const panel=document.querySelector('#panel');
function showMemory(i){activeMemory=i;const m=memories[i];document.querySelector('#fragmentNo').textContent=`FRAGMENT 00${i+1}`;document.querySelector('#fragmentTitle').textContent=m.title;document.querySelector('#fragmentText').textContent=m.text;panel.classList.add('open');document.querySelector('#progress').style.width=((i+1)/memories.length*100)+'%';memoryMeshes[i].scale.setScalar(1.7)}
function closePanel(){panel.classList.remove('open');if(activeMemory>=0)memoryMeshes[activeMemory].scale.setScalar(1);activeMemory=-1}
document.querySelector('#closePanel').onclick=closePanel;
renderer.domElement.addEventListener('pointerdown',e=>{down=true;lastX=e.clientX;lastY=e.clientY;startX=e.clientX;startY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(down){targetY+=(e.clientX-lastX)*.004;targetX+=(e.clientY-lastY)*.003;targetX=Math.max(-.65,Math.min(.65,targetX));lastX=e.clientX;lastY=e.clientY}});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;down=false;const dx=Math.abs(e.clientX-startX),dy=Math.abs(e.clientY-startY);if(dx+dy<9){pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(memoryGroup.children,true);if(hits.length){let obj=hits[0].object;while(obj.parent&&obj.userData.index===undefined)obj=obj.parent;if(obj.userData.index!==undefined)showMemory(obj.userData.index)}}});
renderer.domElement.addEventListener('wheel',e=>{zoom=Math.max(9,Math.min(28,zoom+e.deltaY*.012));travel=Math.max(0,Math.min(1,(28-zoom)/19));document.querySelector('#progress').style.width=(travel*100)+'%'},{passive:true});
document.querySelector('#reset').onclick=()=>{zoom=17;targetX=0;targetY=0;travel=0;closePanel();document.querySelector('#progress').style.width='0%'};
let audioCtx=null,osc=null,gain=null,soundOn=false;
document.querySelector('#sound').onclick=()=>{soundOn=!soundOn;const b=document.querySelector('#sound');b.textContent='SOUND : '+(soundOn?'ON':'OFF');b.classList.toggle('active',soundOn);if(soundOn){audioCtx=new (window.AudioContext||window.webkitAudioContext)();osc=audioCtx.createOscillator();gain=audioCtx.createGain();const filter=audioCtx.createBiquadFilter();osc.type='sine';osc.frequency.value=54;filter.type='lowpass';filter.frequency.value=130;gain.gain.value=.025;osc.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);osc.start()}else if(audioCtx){gain.gain.setTargetAtTime(0,audioCtx.currentTime,.15);osc.stop(audioCtx.currentTime+.6);audioCtx.close();audioCtx=null}};
addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();if(e.key==='ArrowLeft')targetY-=.15;if(e.key==='ArrowRight')targetY+=.15;if(e.key==='ArrowUp')zoom=Math.max(9,zoom-1);if(e.key==='ArrowDown')zoom=Math.min(28,zoom+1)});
let clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime(),dt=Math.min(clock.getDelta(),.04);
 rotX+=(targetX-rotX)*.035;rotY+=(targetY-rotY)*.035;
 core.rotation.x=rotX*.45+Math.sin(t*.12)*.035;core.rotation.y=rotY*.35+t*.045;core.rotation.z=-.08+Math.sin(t*.18)*.025;
 halo.rotation.z=t*.12;halo2.rotation.z=-t*.08;singularity.scale.setScalar(1+Math.sin(t*1.3)*.035);
 memoryGroup.rotation.y=t*.025+rotY*.2;memoryMeshes.forEach((m,i)=>{m.position.y+=Math.sin(t*.7+i*2)*.0008;m.rotation.y=t*.3+i;m.children[0].scale.setScalar(1+Math.sin(t*2+i)*.12)});
 dust.rotation.y=t*.008;stars.rotation.y=t*.001;
 const p=sandGeo.attributes.position.array;for(let i=0;i<sandCount;i++){const d=sandData[i],a=d.a+t*d.speed*.22;p[i*3]=Math.cos(a)*d.r;p[i*3+1]=d.y+Math.sin(t*d.speed+d.phase)*.11;p[i*3+2]=Math.sin(a)*d.r;}sandGeo.attributes.position.needsUpdate=true;
 camera.position.z+=(zoom-camera.position.z)*.035;camera.position.x+=(Math.sin(rotY)*1.8-camera.position.x)*.025;camera.position.y+=(1.4+rotX*2-camera.position.y)*.025;camera.lookAt(0,0,-1.8);
 composer.render()}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);bloom.setSize(innerWidth,innerHeight)});
setTimeout(()=>document.querySelector('#loading').classList.add('done'),900);
</script>
</body>
</html>
